name: Add domain

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain (e.g. tilljoyfully.com)"
        required: true
        type: string
      list:
        description: "Which list"
        required: true
        type: choice
        options:
          - blocklist
          - allowlist
      match:
        description: "Match type"
        required: true
        type: choice
        options:
          - wildcard (domain + all subdomains)
          - exact (this name only)
      note:
        description: "Note, optional (e.g. 'Reuters ad domain')"
        required: false
        type: string

permissions:
  contents: write

# Two submissions at once would race on the same file.
concurrency:
  group: add-domain

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add domain
        id: add
        env:
          DOMAIN: ${{ inputs.domain }}
          LIST: ${{ inputs.list }}
          MATCH: ${{ inputs.match }}
          NOTE: ${{ inputs.note }}
        run: |
          match=${MATCH%% *}
          set +e
          out=$(bash .github/scripts/add-domain.sh "$DOMAIN" "$LIST" "$match" "$NOTE")
          rc=$?
          set -e
          echo "$out"
          { echo "### $LIST: \`$DOMAIN\` ($match)"; echo; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [[ $rc -eq 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "entry=$(sed -n 's/^ADDED: \(.*\) to .*/\1/p' <<< "$out")" >> "$GITHUB_OUTPUT"
          fi
          [[ $rc -eq 0 || $rc -eq 3 ]]

      - name: Commit
        if: steps.add.outputs.changed == 'true'
        env:
          ENTRY: ${{ steps.add.outputs.entry }}
          LIST: ${{ inputs.list }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git commit -am "Add $ENTRY to $LIST"
          git push
